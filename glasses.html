<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>통역 자막 (안경)</title>
<meta name="theme-color" content="#000000">
<style>
  :root{
    --bg:#000000; --accent:#22d3ee; --text:#f1f5f9; --muted:#7c8aa5;
    --danger:#f87171; --ok:#34d399;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; background:#000;}
  body{
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; overflow:hidden;
  }
  #stage{
    width:min(600px, 100vmin);
    height:min(600px, 100vmin);
    background:var(--bg);
    display:flex; flex-direction:column;
    overflow:hidden; position:relative;
  }
  header{
    padding:8px 14px 6px 14px;
    display:flex; align-items:center; gap:6px;
    flex-shrink:0;
  }
  .status-dot{width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0;}
  .status-dot.live{background:var(--ok); box-shadow:0 0 8px var(--ok);}
  .status-dot.error{background:var(--danger);}
  #statusText{font-size:10px; color:var(--muted);}

  /* 프롬프터식 스크롤 영역: 아래에서 위로 흐름 */
  #feed{
    flex:1;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;   /* 항상 최신 줄이 하단에 오도록 */
    padding:12px 18px 18px 18px;
    gap:10px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 100%);
  }
  .line{
    font-size:24px; line-height:1.35; font-weight:600;
    word-break:keep-all;
    animation:rise .3s ease;
    opacity:.55;
    transition:opacity .3s;
  }
  .line.current{ opacity:1; }        /* 가장 최신 줄은 밝게 */
  .line.partial{ color:var(--accent); }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:.55; transform:translateY(0);}
  }
  /* 화자 색상 (목소리 구분) */
  .spk0{ border-left:3px solid #22d3ee; padding-left:10px; }
  .spk1{ border-left:3px solid #f9a8d4; padding-left:10px; }
  .spk2{ border-left:3px solid #86efac; padding-left:10px; }
  .spk3{ border-left:3px solid #fcd34d; padding-left:10px; }

  #emptyMsg{
    margin:auto; text-align:center; color:var(--muted); font-size:13px; line-height:1.6;
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">연결 중…</span>
  </header>
  <div id="feed">
    <div id="emptyMsg">폰에서 통역을 시작하면<br>여기에 자막이 흐르며 표시됩니다.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="glasses.js"></script>
</body>
</html>
